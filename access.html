<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navsari RentEasy - Login</title>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: antiquewhite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #nav-container,
        #footer-container {
            z-index: 10;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-card h4 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 30px;
            color: #0b0b0b;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            color: #333;
            background-color: #fff;
        }

        .form-control::placeholder {
            color: #999;
            opacity: 1;
        }

        .btn-login {
            border-radius: 10px;
            background-color: #01060f;
            border: none;
            padding: 12px;
            font-weight: bold;
            color: #fff;
        }

        .password-wrapper {
            position: relative;
        }

        .form-check-label {
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <div id="nav-container"></div>
    <div class="login-wrapper">
        <div class="login-card">
            <h4>Login to RentEasy (Navsari)</h4>
            <form action="login.php" method="POST">
                <div class="mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-3 password-wrapper">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Password"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">User Type</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="userType" id="tenant" value="Tenant"
                            required>
                        <label class="form-check-label" for="tenant">Tenant</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="userType" id="landlord" value="Landlord"
                            required>
                        <label class="form-check-label" for="landlord">Landlord</label>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-login">Login</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p>Don’t have an account? <a href="register.html">Register Yourself</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load Navbar
        fetch("navbar.html")
            .then(res => res.text())
            .then(data => document.getElementById("nav-container").innerHTML = data);

        // Load Footer
        fetch("footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer-container").innerHTML = data);
    </script>
</body>

</html>
