<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navsari RentEasy - Register</title>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: antiquewhite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #nav-container,
        #footer-container {
            z-index: 10;
        }

        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }


        .register-card h4 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 30px;
            color: #040507;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            color: #333;
            background-color: #fff;
        }


        .btn-register {
            border-radius: 10px;
            background-color: #090909;
            border: none;
            padding: 12px;
            font-weight: bold;
            color: #fff;
        }

        .form-check-label {
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div id="nav-container"></div>

    <!-- Registration Form -->
    <div class="register-wrapper">
        <div class="register-card">
            <h4>Register Yourself (Navsari)</h4>
            <form id="registerForm" action="register.php" method="POST" onsubmit="return validateForm()">
                <div class="mb-3"><input type="text" name="name" id="name" class="form-control" placeholder="Full Name"
                        required></div>
                <div class="mb-3"><input type="email" name="email" id="email" class="form-control" placeholder="Email"
                        required></div>
                <div class="mb-3"><input type="text" name="pno" id="pno" class="form-control" placeholder="Phone Number"
                        required></div>
                <div class="mb-3"><input type="password" name="password" id="password" class="form-control"
                        placeholder="Password" required></div>
                <div class="mb-3"><input type="text" name="address" id="address" class="form-control"
                        placeholder="Address" required></div>
                <div class="mb-3"><input type="text" name="city" id="city" class="form-control" value="Navsari" readonly
                        required></div>
                <div class="mb-3"><input type="text" name="state" id="state" class="form-control" value="Gujarat"
                        readonly required></div>
                <div class="mb-3"><input type="text" name="zip" id="zip" class="form-control" placeholder="Zip Code"
                        required></div>

                <div class="mb-3 d-flex justify-content-start">
                    <label class="me-3">Gender:</label>
                    <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="gender1"
                            value="Male" required><label class="form-check-label" for="gender1">Male</label></div>
                    <div class="form-check ms-3"><input class="form-check-input" type="radio" name="gender" id="gender2"
                            value="Female" required><label class="form-check-label" for="gender2">Female</label></div>
                </div>

                <div class="mb-3 d-flex justify-content-start">
                    <label class="me-3">User Type:</label>
                    <div class="form-check"><input class="form-check-input" type="radio" name="userType" id="userType1"
                            value="Tenant" required><label class="form-check-label" for="userType1">Tenant</label></div>
                    <div class="form-check ms-3"><input class="form-check-input" type="radio" name="userType"
                            id="userType2" value="Landlord" required><label class="form-check-label"
                            for="userType2">Landlord</label></div>
                </div>

                <div class="d-grid"><button type="submit" class="btn btn-register">Register</button></div>
                <p class="text-center mt-3">Already have an account? <a href="access.html">Login Here</a></p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch("navbar.html").then(res => res.text()).then(data => document.getElementById("nav-container").innerHTML = data);
        fetch("footer.html").then(res => res.text()).then(data => document.getElementById("footer-container").innerHTML = data);

        function validateForm() {
            const name = document.getElementById('name').value.trim();
            if (name.length < 3) { alert("Full Name must be at least 3 characters."); return false; }

            const email = document.getElementById('email').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Invalid email."); return false; }

            const pno = document.getElementById('pno').value.trim();
            if (!/^\d{10}$/.test(pno)) { alert("Phone must be 10 digits."); return false; }

            const password = document.getElementById('password').value;
            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/.test(password)) { alert("Password too weak."); return false; }

            const address = document.getElementById('address').value.trim();
            if (address.length < 5) { alert("Address too short."); return false; }

            const zip = document.getElementById('zip').value.trim();
            if (!/^\d{5,6}$/.test(zip)) { alert("Invalid zip code."); return false; }

            const gender = document.querySelector('input[name="gender"]:checked');
            if (!gender) { alert("Select gender."); return false; }

            const userType = document.querySelector('input[name="userType"]:checked');
            if (!userType) { alert("Select user type."); return false; }

            return true;
        }
    </script>
</body>

</html>
